<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code vs Errors — Prototype</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, Segoe UI, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: #0c1420; color: #eaf3ff; }
  main { width: min(100%, 1000px); }
  h1 { margin: 0 0 8px; color: #70e5ff; font-size: clamp(1.4rem, 3vw, 2rem); }
  p { color: #bac9d9; margin: 0 0 12px; }
  canvas { display: block; width: 100%; height: auto; border: 1px solid #496178; border-radius: 12px; background: #101827; box-shadow: 0 16px 50px #0008; touch-action: manipulation; }
  .hint { margin-top: 10px; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Code vs Errors</h1>
  <p>Defend your codebase! Choose a unit card, then click an empty tile to place it.</p>
  <canvas id="game" width="1280" height="720" aria-label="Code vs Errors game"></canvas>
  <p class="hint">Compilers shoot bugs in their lane. Firewalls block them. Start with 50 GB RAM; gain 50 GB every 10 seconds. Each unit costs 50 GB. Survive 75 seconds to win. Click after the game ends to restart.</p>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ROWS = 5, COLS = 9, LEFT = 250, TOP = 120, CW = 105, CH = 100;
  let board, defenders, enemies, shots, ram, score, selected, elapsed, ramTimer, spawnTimer, ended, won, lastTime;

  function reset() {
    board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
    defenders = []; enemies = []; shots = [];
    ram = 50; score = 0; selected = null; elapsed = 0; ramTimer = 0; spawnTimer = 3;
    ended = false; won = false; lastTime = performance.now();
  }
  function spawnEnemy() {
    const lane = Math.floor(Math.random() * ROWS);
    const hp = 100 + elapsed * 1.2;
    enemies.push({x: 1250, lane, hp, maxHp: hp, speed: 12 + elapsed * .05, attack: 0});
  }
  function update(dt) {
    if (ended) return;
    elapsed += dt; ramTimer += dt; spawnTimer -= dt;
    if (ramTimer >= 10) { ramTimer -= 10; ram = Math.min(999, ram + 50); }
    if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(.8, 2.8 - elapsed * .018); }

    for (const d of defenders) {
      d.cooldown -= dt;
      if (d.type === 'compiler' && d.cooldown <= 0 && enemies.some(e => e.lane === d.lane && e.x > d.x)) {
        d.cooldown = 1;
        shots.push({x: d.x + 24, lane: d.lane, damage: 20});
      }
    }
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i]; s.x += 280 * dt;
      const j = enemies.findIndex(e => e.lane === s.lane && Math.abs(e.x - s.x) < 25);
      if (j >= 0) {
        enemies[j].hp -= s.damage; shots.splice(i, 1);
        if (enemies[j].hp <= 0) { enemies.splice(j, 1); score += 100; }
      } else if (s.x > 1280) shots.splice(i, 1);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i]; e.attack -= dt;
      const d = defenders.find(unit => unit.lane === e.lane && Math.abs(unit.x - e.x) < 42);
      if (d) {
        if (e.attack <= 0) {
          e.attack = .9; d.hp -= 18;
          if (d.hp <= 0) { board[d.lane][d.col] = null; defenders.splice(defenders.indexOf(d), 1); }
        }
      } else e.x -= e.speed * dt;
      if (e.x < 105) { enemies.splice(i, 1); ended = true; won = false; }
    }
    if (elapsed >= 75 && !ended) { ended = true; won = true; }
  }
  function text(str, x, y, size, color = '#fff', align = 'left') {
    ctx.font = `600 ${size}px system-ui, Segoe UI, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y);
  }
  function bar(x, y, ratio) {
    ctx.fillStyle = '#3b1c23'; ctx.fillRect(x - 25, y, 50, 5);
    ctx.fillStyle = '#72dd88'; ctx.fillRect(x - 25, y, 50 * Math.max(0, Math.min(1, ratio)), 5);
  }
  function drawCard(y, name, cost, color, type) {
    ctx.fillStyle = selected === type ? '#0b111b' : '#26384d'; ctx.fillRect(20, y, 100, 90);
    ctx.strokeStyle = selected === type ? '#70e5ff' : '#496178'; ctx.lineWidth = 3; ctx.strokeRect(21.5, y + 1.5, 97, 87);
    ctx.fillStyle = color; ctx.fillRect(28, y + 8, 84, 54);
    text(name, 70, y + 42, 13, '#101827', 'center');
    text(`${cost} GB`, 70, y + 80, 13, '#fff', 'center');
  }
  function draw() {
    ctx.clearRect(0, 0, 1280, 720);
    ctx.fillStyle = '#101827'; ctx.fillRect(0, 0, 1280, 720);
    ctx.fillStyle = '#18324a'; ctx.fillRect(0, 80, 1280, 560);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#314f50' : '#2a4c45';
      ctx.fillRect(LEFT + c * CW, TOP + r * CH, CW, CH);
      ctx.strokeStyle = '#92cbb044'; ctx.lineWidth = 1;
      ctx.strokeRect(LEFT + c * CW + .5, TOP + r * CH + .5, CW, CH);
    }
    ctx.fillStyle = '#26384d'; ctx.fillRect(20, 20, 210, 48);
    text(`RAM: ${ram} GB`, 35, 51, 20, '#70e5ff');
    text(`SCORE: ${score}`, 250, 50, 20);
    text(`SURVIVE: ${Math.min(75, elapsed).toFixed(0)} / 75s`, 480, 50, 20, '#ffcf70');
    drawCard(120, 'COMPILER', 50, '#55b9ff', 'compiler');
    drawCard(225, 'FIREWALL', 50, '#f49b55', 'firewall');

    for (const d of defenders) {
      if (d.type === 'compiler') {
        ctx.fillStyle = '#55b9ff'; ctx.beginPath(); ctx.arc(d.x, d.y, 28, 0, Math.PI * 2); ctx.fill();
        text('</>', d.x, d.y + 7, 17, '#10253a', 'center');
      } else {
        ctx.fillStyle = '#f49b55'; ctx.fillRect(d.x - 27, d.y - 27, 54, 54);
        text('DEF', d.x, d.y + 7, 16, '#40220d', 'center');
      }
      bar(d.x, d.y - 38, d.hp / 100);
    }
    for (const e of enemies) {
      const y = TOP + e.lane * CH + CH / 2;
      ctx.fillStyle = '#ec6071'; ctx.beginPath(); ctx.arc(e.x, y, 30, 0, Math.PI * 2); ctx.fill();
      text('BUG', e.x, y + 6, 16, '#fff', 'center'); bar(e.x, y - 40, e.hp / e.maxHp);
    }
    for (const s of shots) {
      ctx.fillStyle = '#f2f7aa'; ctx.beginPath(); ctx.arc(s.x, TOP + s.lane * CH + CH / 2, 7, 0, Math.PI * 2); ctx.fill();
    }
    if (ended) {
      ctx.fillStyle = '#101827ee'; ctx.fillRect(390, 260, 500, 200);
      text(won ? 'SYSTEM SECURED!' : 'SYSTEM CRASHED', 640, 330, 36, won ? '#70e5ff' : '#ff7777', 'center');
      text(`Score: ${score}`, 640, 375, 24, '#fff', 'center');
      text('Click to restart', 640, 420, 18, '#b4c0cc', 'center');
    }
  }
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, .05); lastTime = now;
    update(dt); draw(); requestAnimationFrame(frame);
  }
  canvas.addEventListener('pointerdown', event => {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * canvas.width / rect.width;
    const y = (event.clientY - rect.top) * canvas.height / rect.height;
    if (ended) { reset(); return; }
    if (x >= 20 && x <= 120 && y >= 120 && y <= 210) { selected = 'compiler'; return; }
    if (x >= 20 && x <= 120 && y >= 225 && y <= 315) { selected = 'firewall'; return; }
    if (!selected) return;
    const col = Math.floor((x - LEFT) / CW), row = Math.floor((y - TOP) / CH);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS || board[row][col]) return;
    const cost = 50;
    if (ram < cost) return;
    ram -= cost;
    const d = {x: LEFT + col * CW + CW / 2, y: TOP + row * CH + CH / 2, lane: row, col, type: selected, hp: 100, cooldown: .2};
    defenders.push(d); board[row][col] = selected; selected = null;
  });
  reset(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
